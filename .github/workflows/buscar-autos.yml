name: "Buscar autos CABA"

on:
  schedule:
    - cron: "0 * * * *" # cada 1 hora
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node scraper.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

      - name: Guardar estado (avisos ya enviados)
        run: |
          git config user.name "bot-autos-caba"
          git config user.email "actions@github.com"
          git add sent_ids.json
          git diff --cached --quiet || git commit -m "Actualiza avisos enviados"
          git push
