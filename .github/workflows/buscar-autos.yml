name: "Buscar autos CABA"

on:
  schedule:
    - cron: "*/30 * * * *" # cada 30 minutos
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  buscar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install

      - run: node scraper.js
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_KV_NAMESPACE_ID: ${{ secrets.CLOUDFLARE_KV_NAMESPACE_ID }}
          KAVAK_PROXY_URL: ${{ secrets.KAVAK_PROXY_URL }}
          KAVAK_PROXY_SECRET: ${{ secrets.KAVAK_PROXY_SECRET }}

      - name: Guardar estado (avisos ya enviados)
        run: |
          git config user.name "bot-autos-caba"
          git config user.email "actions@github.com"
          git add sent_ids.json
          git diff --cached --quiet || git commit -m "Actualiza avisos enviados"
          git push
